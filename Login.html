<!DOCTYPE html>

<html id="html-root" lang="en">
<head>
    <script>
        // Synchronize theme with Chat settings
        (function() {
            const saved = localStorage.getItem('orka_settings');
            if (saved) {
                const settings = JSON.parse(saved);
                if (settings.darkMode === false) {
                    document.documentElement.classList.remove('dark');
                } else {
                    document.documentElement.classList.add('dark');
                }
            } else {
                // Default to dark
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" name="viewport"/>
<title>Orka - Secure Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-container": "var(--primary-container)",
              "on-secondary-fixed-variant": "#4A3244",
              "surface-dim": "var(--surface-dim)",
              "secondary": "var(--secondary)",
              "surface-container": "var(--surface-container)",
              "tertiary-container": "var(--tertiary-container)",
              "tertiary-fixed-dim": "var(--tertiary-fixed-dim)",
              "surface-bright": "var(--surface-bright)",
              "error-container": "#9f0519",
              "on-tertiary-fixed": "#1A0F26",
              "on-surface-variant": "var(--on-surface-variant)",
              "on-error": "#490006",
              "inverse-on-surface": "#444444",
              "primary": "var(--primary)",
              "on-secondary": "#2D1B29",
              "surface-container-high": "var(--surface-container-high)",
              "surface-tint": "var(--primary)",
              "on-background": "var(--on-surface)",
              "surface": "var(--surface)",
              "background": "var(--surface)",
              "secondary-fixed": "#D9BDD1",
              "primary-fixed": "#F0DCEB",
              "primary-dim": "var(--primary)",
              "inverse-surface": "#F2F2F2",
              "tertiary-fixed": "#C8B6DB",
              "on-primary": "var(--on-primary)",
              "on-secondary-fixed": "#361F30",
              "on-primary-fixed": "#321429",
              "inverse-primary": "#8A5C7C",
              "surface-container-lowest": "var(--surface-container-lowest)",
              "primary-fixed-dim": "var(--primary)",
              "outline": "#858585",
              "on-tertiary": "#2A193D",
              "on-surface": "var(--on-surface)",
              "on-tertiary-container": "#1A0F26",
              "surface-container-highest": "var(--surface-container-highest)",
              "surface-container-low": "var(--surface-container-low)",
              "on-error-container": "#ffa8a3",
              "tertiary-dim": "var(--tertiary-container)",
              "secondary-container": "#4A3244",
              "error-dim": "#d7383b",
              "secondary-fixed-dim": "#9E6D8F",
              "on-primary-container": "var(--on-primary-container)",
              "error": "#ff716c",
              "tertiary": "#9B85B5",
              "surface-variant": "var(--surface-container-highest)",
              "on-secondary-container": "#F5EBF2",
              "secondary-dim": "#855878",
              "outline-variant": "var(--outline-variant)",
              "on-tertiary-fixed-variant": "#3D2C52",
              "on-primary-fixed-variant": "var(--on-primary-container)"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      :root {
        --primary: #B784A7;
        --primary-container: #4A223E;
        --on-primary: #FFFFFF;
        --on-primary-container: #F0DCEB;
        --secondary: #9E6D8F;
        --surface: #000000;
        --surface-container-lowest: #000000;
        --surface-container-low: #0e0e0e;
        --surface-container: #131313;
        --surface-container-high: #1f1f1f;
        --surface-container-highest: #262626;
        --surface-dim: #050505;
        --surface-bright: #1F1F1F;
        --on-surface: #ffffff;
        --on-surface-variant: #ababab;
        --outline-variant: #484848;
        --tertiary-container: #4A3244;
      }
      :root:not(.dark) {
        --surface: #F8F9FA;
        --surface-container-lowest: #FFFFFF;
        --surface-container-low: #F1F3F4;
        --surface-container: #FFFFFF;
        --surface-container-high: #E8EAED;
        --surface-container-highest: #DADCE0;
        --surface-dim: #FAFAFA;
        --surface-bright: #FFFFFF;
        --on-surface: #1A1C1E;
        --on-surface-variant: #44474E;
        --outline-variant: #C4C6D0;
        --primary-container: #B784A7;
        --on-primary: #FFFFFF;
        --on-primary-container: #4A223E;
        --tertiary-container: #F0DCEB;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .obsidian-glow {
        box-shadow: 0 0 40px -10px rgba(183, 132, 167, 0.25);
      }
      .text-glow {
        text-shadow: 0 0 20px rgba(183, 132, 167, 0.5);
      }
      .gradient-button {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-container) 100%);
      }
    </style>
<style>
      body {
        height: 100dvh;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
    </style>
    <script>
      document.addEventListener('copy', (e) => e.preventDefault());
    </script>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body h-[100dvh] flex flex-col items-center justify-center p-6 selection:bg-primary/30 overflow-hidden">
<!-- Hero Identity Section -->
<header class="mb-16 text-center">
<div class="relative inline-block mb-4">
<!-- Pulsing background element for the logo -->
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full scale-150"></div>
<h1 class="font-headline font-black tracking-tighter text-7xl md:text-8xl text-primary-container text-glow relative z-10 uppercase">
                Orka
            </h1>
</div>
<p class="font-headline font-medium text-on-surface-variant tracking-[0.2em] text-sm uppercase opacity-80">
            Secure Communications Protocol
        </p>
</header>
<!-- Login Canvas -->
<main class="w-full max-w-[420px] space-y-8">
<form id="login-form" class="space-y-6">
<!-- Username Input -->
<div class="space-y-2">
<label class="block font-headline font-bold text-xs uppercase tracking-widest text-primary ml-1" for="username">
                    Username
                </label>
<div class="relative group">
<div class="absolute inset-0 bg-primary/10 rounded-xl blur-md opacity-0 group-focus-within:opacity-100 transition-opacity duration-500"></div>
<input class="w-full bg-surface-container-low border border-outline-variant/30 focus:border-primary/50 focus:ring-1 focus:ring-primary/40 text-on-surface placeholder:text-on-surface-variant/40 rounded-xl px-5 py-4 font-medium transition-all relative z-10" id="username" placeholder="Enter identifier" type="text"/>
</div>
</div>
<!-- Port Input -->
<div class="space-y-2">
<label class="block font-headline font-bold text-xs uppercase tracking-widest text-primary ml-1" for="port">
                    Port
                </label>
<div class="relative group">
<div class="absolute inset-0 bg-primary/10 rounded-xl blur-md opacity-0 group-focus-within:opacity-100 transition-opacity duration-500"></div>
<input class="w-full bg-surface-container-low border border-outline-variant/30 focus:border-primary/50 focus:ring-1 focus:ring-primary/40 text-on-surface placeholder:text-on-surface-variant/40 rounded-xl px-5 py-4 font-medium transition-all relative z-10" id="port" placeholder="Enter port number" type="text"/>
</div>
</div>
<!-- Action Area -->
<div class="pt-4 space-y-6">
<button class="gradient-button w-full py-5 rounded-full text-on-primary font-headline font-extrabold text-sm uppercase tracking-widest obsidian-glow hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Establish Connection
                    <span class="material-symbols-outlined text-xl no-underline">login</span>
</button>
</div>
</div>
</form>
</main>
<!-- Footer Security Badge -->
<footer class="mt-auto pt-12 pb-4 opacity-30 flex items-center gap-2 select-none pointer-events-none">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-headline font-bold text-[10px] uppercase tracking-widest">End-to-End Encrypted</span>
</footer>
<!-- Background Accents (Subtle AMOLED Textures) -->
<div class="fixed top-0 left-0 w-full h-full -z-50 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[40%] bg-tertiary/5 blur-[100px] rounded-full"></div>
</div>
<script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const port = document.getElementById('port').value.trim();
        if(username && port) {
            window.location.href = `/chat?username=${encodeURIComponent(username)}&port=${encodeURIComponent(port)}`;
        }
    });
</script>
</body></html>
