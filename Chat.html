<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "var(--primary)",
                        "primary-container": "var(--primary-container)",
                        "on-primary": "#ffffff",
                        "on-primary-container": "var(--on-primary-container)",
                        "secondary": "var(--secondary)", 
                        "surface": "var(--surface)",
                        "surface-container": "var(--surface-container)",
                        "surface-container-low": "var(--surface-container-low)",
                        "surface-container-high": "var(--surface-container-high)",
                        "surface-container-highest": "var(--surface-container-highest)",
                        "on-surface": "#ffffff",
                        "on-surface-variant": "#ababab",
                        "outline-variant": "#484848",
                        "background": "var(--surface)"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "var(--radius)", 
                        "lg": "var(--radius-lg)", 
                        "xl": "var(--radius-xl)", 
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        :root {
            --primary: #B784A7;
            --primary-container: #4A223E;
            --on-primary-container: #F0DCEB;
            --secondary: #9E6D8F;
            --surface: #000000;
            --surface-container: #131313;
            --surface-container-low: #0e0e0e;
            --surface-container-high: #1f1f1f;
            --surface-container-highest: #262626;
            --primary-rgb: 183, 132, 167;
            --radius: 0.5rem;
            --radius-lg: 0.5rem;
            --radius-xl: 0.75rem;
            --font-size: 15px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        .glass-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1f1f1f;
            border-radius: 10px;
        }
        body {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: #000000;
        }
        .mauve-glow {
            box-shadow: 0 0 24px rgba(var(--primary-rgb), 0.3);
        }
        .bubble-content p {
            font-size: var(--font-size);
        }
        @keyframes typingFadeIn {
            from { opacity: 0; transform: translateY(4px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .typing-indicator-animate {
            animation: typingFadeIn 0.2s cubic-bezier(0, 0, 0.2, 1) forwards;
        }
        .reply-preview-animate {
            animation: typingFadeIn 0.2s cubic-bezier(0, 0, 0.2, 1) forwards;
        }
        .bubble-context-menu {
            transition: opacity 0.15s, transform 0.15s;
        }
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .bubble-content {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .slide-reply-indicator {
            position: absolute;
            top: 50%;
            left: -40px;
            transform: translateY(-50%) scale(0.5);
            opacity: 0;
            transition: all 0.2s;
            color: var(--primary);
        }
        .sliding .slide-reply-indicator {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }
    </style>
</head>
<body class="bg-black text-on-surface font-body selection:bg-primary/30 selection:text-white overflow-hidden">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 bg-[#000000]/80 backdrop-blur-xl flex justify-between items-center px-6 h-20 shrink-0 shadow-[0_4px_20px_rgba(183,132,167,0.04)]">
<div class="flex items-center gap-4">
<button id="menu-btn" class="text-[#ababab] hover:bg-[#1f1f1f] transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<div class="flex items-center gap-3">
<div>
<h1 id="header-title" class="font-headline font-bold tracking-tight text-lg text-white">Secure Node</h1>
<p id="header-subtitle" class="text-[10px] text-primary uppercase tracking-widest font-bold">Connecting...</p>
</div>
</div>
</div>
<div class="flex items-center gap-2">
<button id="settings-btn" title="App Settings" class="text-[#ababab] hover:text-white hover:bg-[#1f1f1f] transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined">settings</span>
</button>
<button id="clear-chat-btn" title="Clear Chat" class="text-[#ababab] hover:text-error hover:bg-[#1f1f1f] transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined">delete_sweep</span>
</button>
<button id="exit-btn" title="Exit Node" class="text-[#ababab] hover:text-error hover:bg-[#1f1f1f] transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined">logout</span>
</button>
</div>
</header>
<!-- Sidebar Drawer -->
<div id="users-sidebar" class="fixed inset-y-0 left-0 w-64 bg-surface-container-highest z-[60] transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
    <div class="p-6 flex items-center justify-between border-b border-outline-variant/20 h-20">
        <h2 class="font-headline font-bold text-lg text-white">Online</h2>
        <button id="close-sidebar-btn" class="text-[#ababab] hover:text-white transition-colors">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>
    <div class="p-6 flex-1 overflow-y-auto w-full custom-scrollbar">
        <ul id="users-list" class="space-y-4">
        </ul>
    </div>
    <div class="p-6 border-t border-outline-variant/20 bg-black/20">
        <h3 class="text-[10px] font-bold text-primary uppercase tracking-widest mb-4">Settings</h3>
        <button id="notification-toggle" class="w-full flex items-center justify-between group">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-[#ababab] group-hover:text-primary transition-colors">notifications</span>
                <span class="text-sm text-on-surface">Push Notifications</span>
            </div>
            <div id="notif-status-dot" class="w-2 h-2 rounded-full bg-error shadow-[0_0_8px_rgba(239,68,68,0.4)]"></div>
        </button>
    </div>
</div>
<!-- Sidebar Overlay -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-[55] hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm"></div>
<!-- Main Chat Canvas -->
<main id="chat-messages-container" class="flex-1 overflow-y-auto px-6 py-6 custom-scrollbar bg-black flex flex-col">
</main>
<!-- Image Preview Modal -->
<div id="image-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/95 backdrop-blur-xl transition-all duration-300 opacity-0 p-4">
    <button id="close-modal" class="absolute top-6 right-6 text-white/70 hover:text-white p-2 rounded-full bg-white/10 active:scale-95 transition-all z-[110]">
        <span class="material-symbols-outlined text-3xl">close</span>
    </button>
    <img id="modal-img" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl scale-95 transition-transform duration-300 pointer-events-none" alt="Full screen preview" src="" />
</div>
<!-- Settings Modal -->
<div id="settings-modal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-black/60 backdrop-blur-md transition-all duration-300 opacity-0 p-4">
    <div id="settings-content" class="w-full max-w-lg bg-surface-container-high border border-outline-variant/30 rounded-3xl shadow-2xl flex flex-col scale-95 transition-transform duration-300 overflow-hidden max-h-[90dvh]">
        <div class="p-6 flex items-center justify-between border-b border-outline-variant/20">
            <h2 class="font-headline font-bold text-xl text-white">App Customization</h2>
            <button id="close-settings" class="text-[#ababab] hover:text-white p-2 rounded-full hover:bg-white/5 transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto custom-scrollbar space-y-8">
            <!-- Accent Color Section -->
            <section>
                <h3 class="text-[10px] font-bold text-primary uppercase tracking-[0.2em] mb-4">Accent Color</h3>
                <div class="flex flex-wrap gap-4">
                    <button title="Mauve Accent" onclick="setAccent('#B784A7', '#4A223E', '183,132,167')" class="w-10 h-10 rounded-full border-2 border-white/20 hover:scale-110 transition-transform cursor-pointer shadow-lg" style="background: #B784A7;"></button>
                    <button title="Electric Blue Accent" onclick="setAccent('#3B82F6', '#172554', '59,130,246')" class="w-10 h-10 rounded-full border-2 border-white/20 hover:scale-110 transition-transform cursor-pointer shadow-lg" style="background: #3B82F6;"></button>
                    <button title="Emerald Accent" onclick="setAccent('#10B881', '#064E3B', '16,184,129')" class="w-10 h-10 rounded-full border-2 border-white/20 hover:scale-110 transition-transform cursor-pointer shadow-lg" style="background: #10B881;"></button>
                    <button title="Crimson Accent" onclick="setAccent('#EF4444', '#450A0A', '239,68,68')" class="w-10 h-10 rounded-full border-2 border-white/20 hover:scale-110 transition-transform cursor-pointer shadow-lg" style="background: #EF4444;"></button>
                    <button title="Amber Accent" onclick="setAccent('#F59E0B', '#451A03', '245,158,11')" class="w-10 h-10 rounded-full border-2 border-white/20 hover:scale-110 transition-transform cursor-pointer shadow-lg" style="background: #F59E0B;"></button>
                    <button title="Violet Accent" onclick="setAccent('#8B5CF6', '#2E1065', '139,92,246')" class="w-10 h-10 rounded-full border-2 border-white/20 hover:scale-110 transition-transform cursor-pointer shadow-lg" style="background: #8B5CF6;"></button>
                    <div title="Custom Color Picker" class="relative w-10 h-10 rounded-full border-2 border-white/20 overflow-hidden shadow-lg group">
                        <input type="color" id="custom-color" aria-label="Custom Color" title="Choose custom color" class="absolute inset-0 w-[200%] h-[200%] -top-4 -left-4 cursor-pointer" oninput="handleCustomColor(this.value)" />
                        <span class="absolute inset-0 flex items-center justify-center pointer-events-none text-white/50 text-[10px]"><span class="material-symbols-outlined text-[16px]">palette</span></span>
                    </div>
                </div>
            </section>

            <!-- Sounds & Effects -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-[10px] font-bold text-primary uppercase tracking-[0.2em]">Chat Sounds</h3>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="sounds-toggle" aria-label="Toggle Chat Sounds" class="sr-only peer" checked onchange="toggleSounds(this.checked)">
                        <div class="w-11 h-6 bg-surface-container rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                    </label>
                </div>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <label for="volume-slider" class="text-sm text-on-surface-variant flex items-center gap-2"><span class="material-symbols-outlined text-sm">volume_up</span> Volume</label>
                        <input type="range" id="volume-slider" title="Notification Volume" aria-label="Notification Volume" min="0" max="1" step="0.1" class="w-32 accent-primary" oninput="updateVolume(this.value)">
                    </div>
                </div>
            </section>

            <!-- Display Customization -->
            <section class="space-y-6">
                <h3 class="text-[10px] font-bold text-primary uppercase tracking-[0.2em]">Display</h3>
                <div class="space-y-4">
                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <label for="font-range" class="text-sm text-on-surface-variant">Message Font Size</label>
                            <span id="font-size-val" class="text-xs text-primary">15px</span>
                        </div>
                        <input type="range" id="font-range" title="Adjust Message Font Size" aria-label="Adjust Message Font Size" min="12" max="20" value="15" class="w-full accent-primary" oninput="updateFontSize(this.value)">
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <label for="radius-range" class="text-sm text-on-surface-variant">Bubble Rounding</label>
                            <span id="radius-val" class="text-xs text-primary">medium</span>
                        </div>
                        <input type="range" id="radius-range" title="Adjust Bubble Roundness" aria-label="Adjust Bubble Roundness" min="0" max="3" value="1" class="w-full accent-primary" oninput="updateRadius(this.value)">
                    </div>
                </div>
            </section>
        </div>
        <div class="p-6 border-t border-outline-variant/20 bg-black/40 flex flex-col gap-3">
            <button onclick="resetToDefaults()" class="w-full py-2.5 rounded-xl border border-primary/30 text-primary text-xs font-bold uppercase tracking-widest hover:bg-primary/5 transition-colors active:scale-[0.98]">Reset to Defaults</button>
            <p class="text-[9px] text-on-surface-variant tracking-wider text-center">Changes are saved automatically to your browser.</p>
        </div>
    </div>
</div>
<!-- Context Menu -->
<div id="context-menu" class="fixed z-[100] hidden flex flex-col bg-surface-container-highest/95 backdrop-blur-xl border border-outline-variant/30 rounded-2xl shadow-2xl p-1 w-44 opacity-0 scale-95 origin-top-left bubble-context-menu">
    <button onclick="handleReplyAction()" class="flex items-center gap-3 px-4 py-2 text-sm font-medium text-white hover:bg-white/10 rounded-xl transition-colors">
        <span class="material-symbols-outlined text-lg">reply</span> Reply
    </button>
    <button onclick="handleCopyAction()" class="flex items-center gap-3 px-4 py-2 text-sm font-medium text-white hover:bg-white/10 rounded-xl transition-colors">
        <span class="material-symbols-outlined text-lg text-white/70">content_copy</span> Copy
    </button>
    <button id="edit-btn" onclick="handleEditAction()" class="flex items-center gap-3 px-4 py-2 text-sm font-medium text-white hover:bg-white/10 rounded-xl transition-colors">
        <span class="material-symbols-outlined text-lg text-white/70">edit</span> Edit
    </button>
    <div class="h-[1px] bg-white/5 my-1 mx-2"></div>
    <button id="unsend-btn" onclick="handleUnsendAction()" class="flex items-center gap-3 px-4 py-2 text-sm font-medium text-rose-400 hover:bg-rose-500/10 rounded-xl transition-colors">
        <span class="material-symbols-outlined text-lg">delete</span> Unsend
    </button>
</div>
<!-- Bottom Input Area -->
<footer class="sticky bottom-0 w-full z-50 px-6 pb-6 bg-black shrink-0">
<div id="edit-preview-bar" class="hidden mb-3 bg-primary/10 rounded-2xl border border-primary/20 overflow-hidden reply-preview-animate">
    <div class="flex items-center gap-3 px-4 py-3 border-l-4 border-primary">
        <div class="flex-1 min-w-0">
            <p class="text-[10px] font-bold text-primary uppercase tracking-wider mb-0.5">Editing Message</p>
            <p id="edit-text" class="text-[13px] text-on-surface-variant truncate"></p>
        </div>
        <button onclick="cancelEdit()" class="text-[#ababab] hover:text-white p-1">
            <span class="material-symbols-outlined text-lg">close</span>
        </button>
    </div>
</div>
<div id="reply-preview-bar" class="hidden mb-3 bg-surface-container-high rounded-2xl border border-outline-variant/20 overflow-hidden reply-preview-animate">
    <div class="flex items-center gap-3 px-4 py-3 border-l-4 border-primary">
        <div class="flex-1 min-w-0">
            <p id="reply-user" class="text-[10px] font-bold text-primary uppercase tracking-wider mb-0.5">Alice</p>
            <p id="reply-text" class="text-[13px] text-on-surface-variant truncate">How are you doing?</p>
        </div>
        <button onclick="cancelReply()" class="text-[#ababab] hover:text-white p-1">
            <span class="material-symbols-outlined text-lg">close</span>
        </button>
    </div>
</div>
<div class="flex items-center gap-3">
<div class="flex-1 flex items-center bg-surface-container-high rounded-[28px] px-4 min-h-[56px] border border-outline-variant/20 focus-within:bg-surface-container-highest transition-all group py-2">
<textarea id="message-input" class="bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-on-surface-variant w-full px-3 text-[15px] resize-none overflow-hidden py-2" placeholder="Message..." rows="1" autocomplete="off"></textarea>
<div class="flex items-center gap-3 pr-1">
<label id="image-btn" title="Upload Image" class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer relative overflow-hidden flex items-center">
<span class="material-symbols-outlined">image</span>
<input type="file" id="image-upload" title="Upload Image" alt="Choose image" accept="image/*" class="absolute inset-0 w-[200%] h-[200%] -top-4 -left-4 opacity-0 cursor-pointer" />
</label>
</div>
</div>
<button id="send-button" class="w-14 h-14 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-white mauve-glow active:scale-90 transition-transform">
<span id="send-btn-icon" class="material-symbols-outlined filled text-2xl">send</span>
</button>
</div>
</footer>
<script src="/socket.io/socket.io.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('username');
    const port = urlParams.get('port');

    if (!username || !port) {
        window.location.href = '/';
    }

    document.getElementById('header-title').innerText = `Port: ${port}`;
    document.getElementById('header-subtitle').innerText = 'Active Node';

    const socket = io();
    const headerSubtitle = document.getElementById('header-subtitle');

    socket.on('connect', () => {
        headerSubtitle.innerText = 'Synchronizing...';
        headerSubtitle.classList.remove('animate-pulse');
        socket.emit('join_room', { username, port });
    });

    socket.on('disconnect', () => {
        headerSubtitle.innerText = 'Offline - Reconnecting';
        headerSubtitle.classList.add('animate-pulse');
    });

    const chatContainer = document.getElementById('chat-messages-container');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');

    function createSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'flex justify-center my-6';
        div.innerHTML = `<span class="text-[10px] font-bold tracking-[0.2em] text-on-surface-variant uppercase bg-surface-container px-4 py-1.5 rounded-full">${text}</span>`;
        return div;
    }

    function createOtherMessage(msg, isConsecutive) {
        const { id, user, text, time, replyTo } = msg;
        const div = document.createElement('div');
        const isImage = text.includes('<img');
        div.id = `msg-${id}`;
        div.className = `flex flex-col ${isImage ? 'max-w-[280px]' : 'max-w-[85%]'} items-start ${isConsecutive ? 'mt-1' : 'mt-6'}`;
        const bubbleRounding = isConsecutive ? 'rounded-2xl' : 'rounded-2xl rounded-tl-sm';
        
        div.innerHTML = `
            ${!isConsecutive ? `<span class="text-[10px] text-primary ml-1 mb-1.5 block font-bold transition-all">${user}</span>` : ''}
            ${replyTo ? `
                <div class="cursor-pointer bg-white/5 border-l-2 border-primary ml-1 mb-1 px-3 py-2 rounded-r-lg max-w-full opacity-90 shadow-sm hover:bg-white/10 transition-colors" onclick="scrollToMessage('${replyTo.id}')">
                    <p class="text-[10px] font-bold text-primary uppercase tracking-wider flex items-center gap-1">
                        <span class="material-symbols-outlined text-[12px]">reply</span> 
                        ${replyTo.user === username ? 'You' : replyTo.user}
                    </p>
                    <p class="text-[11px] truncate text-on-surface-variant/90">${replyTo.text.includes('<img') ? '📷 Photo' : replyTo.text}</p>
                </div>
            ` : ''}
            <div class="relative group w-full flex items-center">
                <div class="slide-reply-indicator material-symbols-outlined">reply</div>
                <div data-msg-id="${id}" data-user="${user}" 
                     oncontextmenu="showContextMenu(event, this)" 
                     onmousedown="startSlide(event, this)" 
                     ontouchstart="handleTouchStart(event, this)"
                     class="bubble-content ${isImage ? 'bg-surface-container-low/30 relative' : 'bg-surface-container-highest text-on-surface px-4 pt-3 pb-2'} ${bubbleRounding} overflow-hidden shadow-sm min-w-[70px] cursor-grab active:cursor-grabbing">
                    ${isImage ? `
                        <div class="cursor-pointer active:scale-[0.98] transition-all" onclick="openImageModal(this.querySelector('img').src)">
                            ${text.replace('<img', `<img class="w-full max-h-[320px] object-contain bg-black/20 block" `)}
                            <div class="absolute bottom-1.5 right-1.5 h-4.5 px-2 bg-black/50 backdrop-blur-md rounded-full flex items-center">
                                <span class="text-[9px] text-white/90 font-medium tabular-nums uppercase tracking-wider leading-none">${time}</span>
                            </div>
                        </div>
                    ` : `
                        <p class="text-[15px] leading-relaxed break-all whitespace-pre-wrap">${text}</p>
                        <div class="flex justify-end mt-1 opacity-40">
                            <span class="text-[9px] font-medium tabular-nums uppercase">${time}</span>
                        </div>
                    `}
                </div>
            </div>
        `;
        return div;
    }

    function createUserMessage(msg, isConsecutive) {
        const { id, user, text, time, replyTo } = msg;
        const div = document.createElement('div');
        const isImage = text.includes('<img');
        div.id = `msg-${id}`;
        div.className = `flex flex-col ${isImage ? 'max-w-[280px]' : 'max-w-[85%]'} items-end ml-auto ${isConsecutive ? 'mt-1' : 'mt-6'}`;
        const bubbleRounding = isConsecutive ? 'rounded-2xl' : 'rounded-2xl rounded-tr-sm';

        div.innerHTML = `
            ${replyTo ? `
                <div class="cursor-pointer bg-white/5 border-r-2 border-white/30 mr-1 mb-1 px-3 py-2 rounded-l-lg max-w-full text-right opacity-90 shadow-sm hover:bg-white/10 transition-colors" onclick="scrollToMessage('${replyTo.id}')">
                    <p class="text-[10px] font-bold text-white/80 uppercase tracking-wider flex items-center justify-end gap-1">
                        ${replyTo.user === username ? 'You' : replyTo.user}
                        <span class="material-symbols-outlined text-[12px]">reply</span>
                    </p>
                    <p class="text-[11px] truncate text-white/60">${replyTo.text.includes('<img') ? '📷 Photo' : replyTo.text}</p>
                </div>
            ` : ''}
            <div class="relative group w-full flex items-center justify-end">
                <div data-msg-id="${id}" data-user="${user}" 
                     oncontextmenu="showContextMenu(event, this)" 
                     onmousedown="startSlide(event, this)" 
                     ontouchstart="handleTouchStart(event, this)"
                     class="bubble-content ${isImage ? 'bg-primary/20 relative' : 'bg-primary text-white px-4 pt-3 pb-2'} ${bubbleRounding} overflow-hidden shadow-[0_4px_16px_rgba(var(--primary-rgb),0.1)] min-w-[85px] cursor-grab active:cursor-grabbing">
                    ${isImage ? `
                        <div class="cursor-pointer active:scale-[0.98] transition-all" onclick="openImageModal(this.querySelector('img').src)">
                            ${text.replace('<img', `<img class="w-full max-h-[320px] object-contain bg-black/20 block" `)}
                            <div class="absolute bottom-1.5 right-1.5 h-4.5 px-2 bg-black/50 backdrop-blur-md rounded-full flex items-center gap-1.5">
                                <span class="text-[9px] text-white/90 font-medium tabular-nums uppercase tracking-wider leading-none">${time}</span>
                                <span class="material-symbols-outlined text-[11px] text-primary" style="font-variation-settings: 'FILL' 1;">done_all</span>
                            </div>
                        </div>
                    ` : `
                        <p class="text-[15px] font-medium leading-relaxed break-all whitespace-pre-wrap">${text}</p>
                        <div class="flex justify-end items-center gap-1.5 mt-1">
                            <span class="text-[9px] text-white/70 font-medium tabular-nums uppercase">${time}</span>
                            <span class="material-symbols-outlined text-[13px] text-white/80" style="font-variation-settings: 'FILL' 1;">done_all</span>
                        </div>
                    `}
                </div>
                <div class="slide-reply-indicator material-symbols-outlined !left-auto !right-[-40px]">reply</div>
            </div>
        `;
        return div;
    }

    function createTypingIndicator(user) {
        const div = document.createElement('div');
        div.id = `typing-${user}`;
        div.className = 'flex items-center gap-2 px-1 mb-6 mt-4 typing-indicator-animate';
        div.innerHTML = `
            <div class="flex gap-2.5 items-center bg-surface-container-low/50 border border-outline-variant/10 px-4 py-2.5 rounded-full backdrop-blur-sm">
            <span class="text-[10px] text-primary/90 font-bold uppercase tracking-wider">${user} is typing</span>
            <div class="flex gap-1.5 items-center ml-1">
                <div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce [animation-duration:1s]"></div>
                <div class="w-1.5 h-1.5 bg-primary/60 rounded-full animate-bounce [animation-duration:1s] [animation-delay:0.15s]"></div>
                <div class="w-1.5 h-1.5 bg-primary/30 rounded-full animate-bounce [animation-duration:1s] [animation-delay:0.3s]"></div>
            </div>
            </div>
        `;
        return div;
    }

    const scrollToBottom = () => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    };

    let lastSender = null;

    const notificationSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');

    function sendNotification(data) {
        if (document.visibilityState === 'visible' || data.user === 'System' || data.user === username) return;
        
        if (settings.sounds) {
            notificationSound.play().catch(e => console.log('Audio play blocked'));
        }

        if (Notification.permission !== 'granted') return;
        
        const cleanText = data.text.includes('<img') ? '📷 Photo' : data.text;
        const notification = new Notification(`Orka | ${data.user}`, {
            body: cleanText,
            icon: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'
        });

        notification.onclick = () => {
            window.focus();
            notification.close();
        };

        // Auto-close after 5 seconds
        setTimeout(() => notification.close(), 5000);
    }

    socket.on('message', (data) => {
        const typingEl = document.getElementById(`typing-${data.user}`);
        if(typingEl) typingEl.remove();

        const isConsecutive = (data.user === lastSender && data.user !== 'System');
        lastSender = data.user;

        if (data.user === 'System') {
            chatContainer.appendChild(createSystemMessage(data.text));
        } else if (data.user === username) {
            chatContainer.appendChild(createUserMessage(data, isConsecutive));
        } else {
            chatContainer.appendChild(createOtherMessage(data, isConsecutive));
            sendNotification(data);
        }
        scrollToBottom();
    });

    socket.on('delete_message', (id) => {
        const el = document.getElementById(`msg-${id}`);
        if(el) {
            const content = el.querySelector('.bubble-content');
            if(content) {
                content.innerHTML = '<p class="text-[12px] italic opacity-50 flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">block</span> This message was unsent</p>';
                content.classList.add('opacity-40');
                content.style.backgroundImage = 'none';
                content.style.backgroundColor = 'transparent';
                content.style.border = '1px dashed rgba(255,255,255,0.1)';
            }
        }
    });

    socket.on('edit_message', ({ id, text }) => {
        const el = document.getElementById(`msg-${id}`);
        if(el) {
            const p = el.querySelector('.bubble-content p');
            if(p) {
                p.innerText = text;
                const timeContainer = el.querySelector('.bubble-content span.text-[9px]');
                if(timeContainer && !timeContainer.innerText.includes('(edited)')) {
                    timeContainer.innerText += ' (edited)';
                }
            }
        }
    });

    socket.on('room_users', (users) => {
        const list = document.getElementById('users-list');
        list.innerHTML = '';
        users.forEach(user => {
            const li = document.createElement('li');
            li.className = 'flex items-center gap-3 text-sm text-on-surface';
            li.innerHTML = `
                <div class="w-2 h-2 rounded-full bg-primary/80 shadow-[0_0_8px_rgba(183,132,167,0.6)]"></div>
                ${user} ${user === username ? '<span class="text-on-surface-variant text-[10px] uppercase ml-1">(You)</span>' : ''}
            `;
            list.appendChild(li);
        });
        document.getElementById('header-subtitle').innerText = `${users.length} Online`;
    });

    socket.on('typing', ({ username: typer, isTyping }) => {
        if(typer === username) return;
        let indicator = document.getElementById(`typing-${typer}`);
        if(isTyping && !indicator) {
            chatContainer.appendChild(createTypingIndicator(typer));
            scrollToBottom();
        } else if(!isTyping && indicator) {
            indicator.remove();
        }
    });

    // Sub-menus
    const sidebar = document.getElementById('users-sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    document.getElementById('menu-btn').addEventListener('click', () => {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
        setTimeout(() => overlay.classList.remove('opacity-0'), 10);
    });

    function updateNotifStatus() {
        const dot = document.getElementById('notif-status-dot');
        if (Notification.permission === 'granted') {
            dot.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]';
        } else if (Notification.permission === 'denied') {
            dot.className = 'w-2 h-2 rounded-full bg-error shadow-[0_0_8px_rgba(239,68,68,0.4)]';
        } else {
            dot.className = 'w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.4)]';
        }
    }

    document.getElementById('notification-toggle').addEventListener('click', () => {
        if (!("Notification" in window)) {
            alert("This browser does not support desktop notifications");
            return;
        }
        Notification.requestPermission().then(permission => {
            updateNotifStatus();
            if (permission === 'granted') {
                new Notification("Orka", { body: "Notifications enabled successfully!", icon: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png' });
            }
        });
    });

    updateNotifStatus();

    function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('opacity-0');
        setTimeout(() => overlay.classList.add('hidden'), 300);
    }
    document.getElementById('close-sidebar-btn').addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);

    document.getElementById('exit-btn').addEventListener('click', () => window.location.href = '/');

    function scrollToMessage(id) {
        const el = document.getElementById(`msg-${id}`);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('mauve-glow');
            setTimeout(() => el.classList.remove('mauve-glow'), 2000);
        }
    }

    // Context Menu & Reply Logic
    let currentReplyTo = null;
    let selectedMsgId = null;
    const contextMenu = document.getElementById('context-menu');
    const replyPreviewBar = document.getElementById('reply-preview-bar');

    // Configuration Logic
    let settings = {
        primary: '#B784A7',
        primaryContainer: '#4A223E',
        primaryRgb: '183,132,167',
        sounds: true,
        volume: 0.5,
        fontSize: 15,
        radius: 1
    };

    function loadSettings() {
        const saved = localStorage.getItem('orka_settings');
        if (saved) {
            settings = { ...settings, ...JSON.parse(saved) };
            applySettings();
        }
    }

    function saveSettings() {
        localStorage.setItem('orka_settings', JSON.stringify(settings));
    }

    const radiusMap = [
        { main: '0rem', lg: '0rem', xl: '0rem', name: 'none' },
        { main: '0.5rem', lg: '0.5rem', xl: '0.75rem', name: 'medium' },
        { main: '1rem', lg: '1.25rem', xl: '1.5rem', name: 'round' },
        { main: '1.75rem', lg: '2rem', xl: '2.5rem', name: 'extra' }
    ];

    function applySettings() {
        const root = document.documentElement;
        root.style.setProperty('--primary', settings.primary);
        root.style.setProperty('--primary-container', settings.primaryContainer);
        root.style.setProperty('--primary-rgb', settings.primaryRgb);
        root.style.setProperty('--font-size', settings.fontSize + 'px');
        
        const rad = radiusMap[settings.radius];
        root.style.setProperty('--radius', rad.main);
        root.style.setProperty('--radius-lg', rad.lg);
        root.style.setProperty('--radius-xl', rad.xl);

        // Update UI Helpers
        document.getElementById('font-size-val').innerText = settings.fontSize + 'px';
        document.getElementById('radius-val').innerText = rad.name;
        document.getElementById('sounds-toggle').checked = settings.sounds;
        document.getElementById('volume-slider').value = settings.volume;
        document.getElementById('font-range').value = settings.fontSize;
        document.getElementById('radius-range').value = settings.radius;
        notificationSound.volume = settings.volume;
    }

    function setAccent(primary, container, rgb) {
        settings.primary = primary;
        settings.primaryContainer = container;
        settings.primaryRgb = rgb;
        applySettings();
        saveSettings();
    }

    function handleCustomColor(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        setAccent(hex, `rgba(${r},${g},${b},0.3)`, `${r},${g},${b}`);
    }

    function toggleSounds(enabled) {
        settings.sounds = enabled;
        saveSettings();
    }

    function updateVolume(val) {
        settings.volume = val;
        notificationSound.volume = val;
        saveSettings();
    }

    function updateFontSize(val) {
        settings.fontSize = val;
        applySettings();
        saveSettings();
    }

    function updateRadius(val) {
        settings.radius = val;
        applySettings();
        saveSettings();
    }

    function resetToDefaults() {
        if (confirm('Reset all customization to defaults?')) {
            settings = {
                primary: '#B784A7',
                primaryContainer: '#4A223E',
                primaryRgb: '183,132,167',
                sounds: true,
                volume: 0.5,
                fontSize: 15,
                radius: 1
            };
            applySettings();
            saveSettings();
        }
    }

    // Modal Control
    const settingsModal = document.getElementById('settings-modal');
    const settingsContent = document.getElementById('settings-content');
    
    document.getElementById('settings-btn').onclick = () => {
        settingsModal.classList.remove('hidden');
        setTimeout(() => {
            settingsModal.classList.remove('opacity-0');
            settingsContent.classList.remove('scale-95');
        }, 10);
    };

    function closeSettings() {
        settingsModal.classList.add('opacity-0');
        settingsContent.classList.add('scale-95');
        setTimeout(() => settingsModal.classList.add('hidden'), 300);
    }

    document.getElementById('close-settings').onclick = closeSettings;
    settingsModal.onclick = (e) => { if (e.target === settingsModal) closeSettings(); };

    loadSettings();

    function showContextMenu(e, el) {
        e.preventDefault();
        selectedMsgId = el.getAttribute('data-msg-id');
        const msgUser = el.getAttribute('data-user');
        const unsendBtn = document.getElementById('unsend-btn');
        const editBtn = document.getElementById('edit-btn');
        const isImage = el.classList.contains('bg-surface-container-low/30') || el.classList.contains('bg-primary/20');
        
        // Only show unsend and edit for own messages
        unsendBtn.classList.toggle('hidden', msgUser !== username);
        editBtn.classList.toggle('hidden', msgUser !== username || isImage);
        
        contextMenu.classList.remove('hidden');
        
        // Smart Position Refined
        const menuWidth = 176;
        const menuHeight = contextMenu.offsetHeight || 180;
        let x = Math.min(e.pageX, window.innerWidth - menuWidth - 20);
        let y = e.pageY;

        // If context menu opens too low, open it upwards
        if (y + menuHeight > window.innerHeight + window.scrollY - 20) {
            y = y - menuHeight;
        }

        contextMenu.style.left = `${Math.max(20, x)}px`;
        contextMenu.style.top = `${y}px`;
        
        setTimeout(() => {
            contextMenu.classList.remove('opacity-0', 'scale-95');
        }, 10);
    }

    function hideContextMenu() {
        contextMenu.classList.add('opacity-0', 'scale-95');
        setTimeout(() => contextMenu.classList.add('hidden'), 150);
    }

    window.addEventListener('click', hideContextMenu);
    window.addEventListener('scroll', hideContextMenu, true);

    function handleReplyAction() {
        const msgEl = document.getElementById(`msg-${selectedMsgId}`);
        const user = msgEl.querySelector('.bubble-content').getAttribute('data-user');
        const textArea = msgEl.querySelector('.bubble-content p');
        const text = textArea ? textArea.innerText : '📷 Photo';
        
        currentReplyTo = { id: selectedMsgId, user, text };
        
        document.getElementById('reply-user').innerText = user === username ? 'You' : user;
        document.getElementById('reply-text').innerText = text;
        replyPreviewBar.classList.remove('hidden');
        cancelEdit();
        messageInput.focus();
    }

    function cancelReply() {
        currentReplyTo = null;
        replyPreviewBar.classList.add('hidden');
    }

    function handleCopyAction() {
        const msgEl = document.getElementById(`msg-${selectedMsgId}`);
        const p = msgEl.querySelector('.bubble-content p');
        if(p) {
            navigator.clipboard.writeText(p.innerText).then(() => {
                // Optional: show toast
            });
        }
    }

    let isEditing = false;
    let editingMsgId = null;

    function handleEditAction() {
        const msgEl = document.getElementById(`msg-${selectedMsgId}`);
        const p = msgEl.querySelector('.bubble-content p');
        if(p) {
            isEditing = true;
            editingMsgId = selectedMsgId;
            messageInput.value = p.innerText;
            document.getElementById('edit-text').innerText = p.innerText;
            document.getElementById('edit-preview-bar').classList.remove('hidden');
            document.getElementById('send-btn-icon').innerText = 'check';
            cancelReply();
            messageInput.focus();
            messageInput.style.height = 'auto';
            messageInput.style.height = messageInput.scrollHeight + 'px';
        }
    }

    function cancelEdit() {
        isEditing = false;
        editingMsgId = null;
        messageInput.value = '';
        messageInput.style.height = 'auto';
        document.getElementById('edit-preview-bar').classList.add('hidden');
        document.getElementById('send-btn-icon').innerText = 'send';
    }

    function handleUnsendAction() {
        if(confirm('Unsend this message for everyone?')) {
            socket.emit('delete_message', selectedMsgId);
        }
    }

    document.addEventListener('copy', (e) => {
        e.preventDefault();
    });

    // Slide to Reply Implementation
    let slideX = 0;
    let startX = 0;
    let isSliding = false;
    let currentSlideEl = null;

    function handleTouchStart(e, el) {
        startX = e.touches[0].pageX;
        currentSlideEl = el;
        isSliding = false;
        
        // Long press for context menu
        el.longPressTimer = setTimeout(() => {
            if (!isSliding) {
                showContextMenu({
                    preventDefault: () => {},
                    pageX: e.touches[0].pageX,
                    pageY: e.touches[0].pageY
                }, el);
            }
        }, 500);

        const onTouchMove = (moveEvent) => {
            const diff = moveEvent.touches[0].pageX - startX;
            if (Math.abs(diff) > 10) {
                isSliding = true;
                clearTimeout(el.longPressTimer);
                const isOwn = el.getAttribute('data-user') === username;
                // Slide direction: right for others, left for own
                slideX = isOwn ? Math.min(0, Math.max(diff, -80)) : Math.max(0, Math.min(diff, 80));
                el.style.transform = `translateX(${slideX}px)`;
                el.parentElement.classList.toggle('sliding', Math.abs(slideX) > 40);
                moveEvent.preventDefault();
            }
        };

        const onTouchEnd = () => {
            if (Math.abs(slideX) > 60) {
                selectedMsgId = el.getAttribute('data-msg-id');
                handleReplyAction();
                if (settings.sounds) notificationSound.play().catch(() => {});
            }
            el.style.transform = '';
            el.parentElement.classList.remove('sliding');
            slideX = 0;
            document.removeEventListener('touchmove', onTouchMove);
            document.removeEventListener('touchend', onTouchEnd);
        };

        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', onTouchEnd);
    }

    function startSlide(e, el) {
        startX = e.pageX;
        currentSlideEl = el;
        isSliding = false;

        const onMouseMove = (moveEvent) => {
            const diff = moveEvent.pageX - startX;
            if (Math.abs(diff) > 5) {
                isSliding = true;
                const isOwn = el.getAttribute('data-user') === username;
                slideX = isOwn ? Math.min(0, Math.max(diff, -80)) : Math.max(0, Math.min(diff, 80));
                el.style.transform = `translateX(${slideX}px)`;
                el.parentElement.classList.toggle('sliding', Math.abs(slideX) > 40);
            }
        };

        const onMouseUp = () => {
            if (Math.abs(slideX) > 60) {
                selectedMsgId = el.getAttribute('data-msg-id');
                handleReplyAction();
            }
            el.style.transform = '';
            el.parentElement.classList.remove('sliding');
            slideX = 0;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    }

    // Long press support for mobile (Legacy catch-all)
    document.addEventListener('touchend', (e) => {
        const bubble = e.target.closest('.bubble-content');
        if(bubble && bubble.longPressTimer) clearTimeout(bubble.longPressTimer);
    });

    // Image Modal Controls
    const imageModal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    
    function openImageModal(src) {
        modalImg.src = src;
        imageModal.classList.remove('hidden');
        setTimeout(() => {
            imageModal.classList.remove('opacity-0');
            modalImg.classList.remove('scale-95');
        }, 10);
    }

    function closeImageModal() {
        imageModal.classList.add('opacity-0');
        modalImg.classList.add('scale-95');
        setTimeout(() => imageModal.classList.add('hidden'), 300);
    }

    document.getElementById('close-modal').onclick = closeImageModal;
    imageModal.onclick = (e) => { if(e.target === imageModal) closeImageModal(); };

    document.getElementById('clear-chat-btn').addEventListener('click', () => {
        if(confirm('Clear message history from your view?')) chatContainer.innerHTML = '';
    });



    document.getElementById('image-upload').addEventListener('change', function() {
        if(this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('send_message', { 
                    text: `<img src="${e.target.result}" />`,
                    replyTo: currentReplyTo 
                });
                cancelReply();
            }
            reader.readAsDataURL(this.files[0]);
            this.value = ''; 
        }
    });

    let typingTimer;
    messageInput.addEventListener('input', () => {
        // Auto-resize textarea
        messageInput.style.height = 'auto';
        messageInput.style.height = messageInput.scrollHeight + 'px';
        
        socket.emit('typing', true);
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => socket.emit('typing', false), 2000);
    });

    function resetInput() {
        messageInput.value = '';
        messageInput.style.height = 'auto';
        socket.emit('typing', false);
        cancelEdit();
        cancelReply();
        messageInput.focus();
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text) {
            if (isEditing) {
                socket.emit('edit_message', { id: editingMsgId, text });
                cancelEdit();
            } else {
                socket.emit('send_message', { 
                    text,
                    replyTo: currentReplyTo 
                });
            }
            resetInput();
        }
    }

    sendButton.addEventListener('mousedown', (e) => {
        // Prevent button from taking focus which hides mobile keyboard
        e.preventDefault();
    });
    sendButton.addEventListener('click', sendMessage);

    // Handle mobile viewport resizing explicitly for older browsers
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            document.body.style.height = `${window.visualViewport.height}px`;
            scrollToBottom();
        });
    }

</script>
</body></html>
